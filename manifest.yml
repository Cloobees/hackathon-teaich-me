display_information:
  name: Onboarding Copilot Channel
  description: Walks a new practice member through Slack, Claude and Context Builder setup.
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: onboarding-copilot-channel
    always_online: true
  slash_commands:
    - command: /onboard-ch
      description: Start your onboarding checklist
      should_escape: true
      usage_hint: "[@member, operators only]"
oauth_config:
  scopes:
    bot:
      - chat:write
      - im:write
      - im:history
      - im:read
      - users:read
      - users:read.email
      - commands
      - channels:read
      - channels:history
      - channels:join
      - groups:read
      - groups:history
      - app_mentions:read
      - canvases:write
      - pins:write
      - files:write
  pkce_enabled: false
settings:
  event_subscriptions:
    bot_events:
      - team_join
      - message.im
      - message.channels
      - message.groups
      - member_joined_channel
      - app_mention
      - app_home_opened
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  is_mcp_enabled: false
  token_rotation_enabled: false
  app_level_token_rotation_enabled: false
